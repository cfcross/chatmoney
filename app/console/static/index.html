<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#126a56" />
    <title>运行总览 · ChatMoney 管理工作台</title>
    <link rel="icon" href="/console/assets/mark.svg" />
    <link rel="stylesheet" href="/console/assets/console.css" />
    <script type="module" src="/console/assets/main.js"></script>
  </head>
  <body class="signed-out">
    <a class="skip" href="#content">跳到主要内容</a>
    <div class="shell">
      <aside class="sidebar">
        <a class="brand" href="#overview" aria-label="返回运行总览"
          ><img
            src="/console/assets/mark.svg"
            width="39"
            height="39"
            alt=""
          /><span>ChatMoney<small>智能助手管理台</small></span></a
        >
        <nav id="nav" aria-label="工作台导航"></nav>
        <div class="side-bottom">
          <div id="identity"></div>
          <button id="switch" type="button" class="account-btn">
            登录工作台
          </button>
        </div>
      </aside>
      <div class="main">
        <header class="bar">
          <span
            >管理工作台 <span class="slash">/</span>
            <b id="crumb">运行总览</b></span
          ><span id="mode" class="mode">工作区未连接</span>
        </header>
        <main id="content" tabindex="-1"></main>
      </div>
    </div>
    <dialog id="dialog" aria-labelledby="dialog-title">
      <div id="dialog-body"></div>
    </dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <noscript>请开启浏览器的 JavaScript 以使用管理工作台。</noscript>
  </body>
</html>
