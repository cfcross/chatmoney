name: chatmoney-prod
x-app-common: &app
  image: chatmoney-engine:research-713249cb5265
  restart: unless-stopped
  init: true
  env_file:
    - ./config/app.env
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 100
  mem_limit: 256m
  logging:
    driver: json-file
    options: {max-size: "5m", max-file: "2"}
  depends_on:
    db: {condition: service_healthy}
services:
  db:
    image: postgres:17
    restart: unless-stopped
    env_file:
      - ./config/db.env
    volumes:
      - data:/var/lib/postgresql/data
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=40", "-c", "work_mem=2MB"]
    mem_limit: 230m
    pids_limit: 90
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cm_owner -d postgres"]
      interval: 8s
      timeout: 4s
      retries: 10
  api:
    <<: *app
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8443", "--ssl-certfile", "/run/chatmoney-tls/origin.crt", "--ssl-keyfile", "/run/chatmoney-tls/origin.key", "--no-proxy-headers", "--no-access-log"]
    ports: ["127.0.0.1:18543:8443"]
    volumes:
      - ./config/tls:/run/chatmoney-tls:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl,urllib.request; urllib.request.urlopen('https://localhost:8443/console',context=ssl.create_default_context(cafile='/run/chatmoney-tls/origin.crt'),timeout=3)"]
      interval: 12s
      timeout: 5s
      retries: 5
  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
  practice:
    <<: *app
    command: ["python","-m","app.worker","--queues","practice"]
  research:
    <<: *app
    command: ["python","-m","app.worker","--queues","research"]
volumes:
  data:
